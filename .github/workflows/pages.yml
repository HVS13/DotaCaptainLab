name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify calculator
        run: |
          node scripts/build.cjs
          node --check dist/overlay.js
          node --check dist/dotacaptain-advisor.user.js
          node tests/advisor.cjs
          node tests/game-controls.cjs
          node tests/items.cjs
          node tests/optimization-deadline.cjs
          node tests/sensitivity.cjs
          node tests/refinement.cjs
          node tests/daily.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
