<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Daily native-control replay</title><style>body{background:#0b121b;color:#e5edf4;font:16px system-ui;padding:20px;max-width:760px}button,input,select{margin:5px;padding:10px;background:#172431;color:#e5edf4;border:1px solid #3a5063}button img{width:50px}section img{width:60px}#submit{text-transform:uppercase}#pool{display:flex;flex-wrap:wrap}[hidden]{display:none}</style></head><body><h1>Daily native-control replay</h1><p>Local fixture: fixed enemies, bans, retained picks, delayed selection and submission acknowledgement.</p><a aria-label="View historical match source for Test game" href="https://example.com/matches/1">Historical match</a><section aria-label="Radiant: Team Falcons"><p>Radiant Team Falcons · locked five</p><div id="enemy"></div></section><section aria-label="Dire: DotaCaptain"><p>Dire Your five · click a hero below</p><div id="own"></div></section><section aria-label="Historical bans"><p>Historical bans</p><div id="bans"></div></section><label>Search heroes <input placeholder="Search heroes…" value="filtered"></label><button aria-label="Filter All">All</button><select aria-label="Filter by role"><option value="carry">Carry</option><option value="all">All roles</option></select><div id="pool"></div><button id="submit" disabled>Lock draft &amp; simulate vs Team Falcons</button><p id="result"></p><script src="../dist/engine.js"></script><script>
const id=n=>DC.heroes.find(h=>h.localized_name===n).id,enemy=['Beastmaster','Snapfire','Hoodwink','Pugna','Gyrocopter'].map(id),bans=['Sand King','Ancient Apparition'].map(id),own=[id('Muerta')];let submissions=0;
const img=h=>{const i=document.createElement('img');i.alt=h.localized_name;i.src=h.img;return i},paintOwn=()=>{const box=document.getElementById('own');box.replaceChildren(...own.map(id=>{const b=document.createElement('button');b.title='Remove '+DC.heroes.find(h=>h.id===id).localized_name;b.append(img(DC.heroes.find(h=>h.id===id)));b.onclick=()=>{own.splice(own.indexOf(id),1);paintOwn()};return b}));document.getElementById('submit').disabled=own.length!==5};
for(const [target,list]of [['enemy',enemy],['bans',bans]])for(const h of DC.heroes.filter(h=>list.includes(h.id)))document.getElementById(target).append(img(h));
for(const h of DC.heroes){const b=document.createElement('button');b.setAttribute('aria-label',h.localized_name);b.disabled=enemy.includes(h.id)||bans.includes(h.id);b.append(img(h));b.onclick=()=>setTimeout(()=>{if(own.length<5&&!own.includes(h.id)){own.push(h.id);paintOwn()}},150);document.getElementById('pool').append(b)}
function filter(){const query=document.querySelector('input').value.toLowerCase(),role=document.querySelector('select').value;for(const b of document.querySelectorAll('#pool button')){const h=DC.heroes.find(h=>h.localized_name===b.getAttribute('aria-label'));b.hidden=!h.localized_name.toLowerCase().includes(query)||role!=='all'&&!h.roles.includes('Carry')}}document.querySelector('input').oninput=filter;document.querySelector('select').onchange=filter;document.querySelector('[aria-label="Filter All"]').onclick=filter;paintOwn();filter();
document.getElementById('submit').onclick=()=>{submissions++;if(submissions!==1)throw Error('Repeated submission');if(own.length!==5||new Set(own).size!==5||own.some(id=>enemy.includes(id)||bans.includes(id)))throw Error('Illegal lineup');document.getElementById('submit').disabled=true;document.getElementById('result').textContent='Starting full simulation…';setTimeout(()=>{document.getElementById('result').textContent='LIVE MATCH · Daily draft submitted once: '+own.map(id=>DC.heroes.find(h=>h.id===id).localized_name).join(', ');document.getElementById('pool').remove();document.querySelector('[aria-label="Dire: DotaCaptain"] p').textContent='Dire Your five · victory'},200)};
</script><script src="bundle-fixture.js?v=daily3"></script></body></html>
