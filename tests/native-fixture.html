<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Native draft detection replay</title><style>body{background:#0c1521;color:#eef5fc;font:16px system-ui;margin:30px;max-width:740px}button{padding:10px;margin:5px}#history{max-width:500px}#history>div{display:grid;border-bottom:1px solid #334;margin:3px;padding:5px}#history>div>div{min-height:25px}img{height:26px}span{margin:0 4px}.font-bold{font-weight:bold}</style></head><body><h1>Native draft DOM replay</h1><p>Uses the paired history structure inspected on the public DotaCaptain draft page. This is a local test fixture.</p><button id="scout">Show scout briefing</button><button id="enter">Enter draft</button><button id="own">Record Muerta pick</button><button id="enemy">Record enemy Chaos Knight</button><button id="ban">Record Axe ban</button><button id="layout">Break/restore history layout</button><button id="complete">Show strategy room</button><input placeholder="Search heroes..." aria-label="Native game search"><p id="turn">YOUR TEAM'S TURN TO BAN</p><div id="history"></div><script src="../dist/engine.js"></script><script>
const DRAFT_PAIRS=[[0,null],[1,2],[4,3],[null,5],[null,6],[7,8],[9,null],[10,11],[13,12],[14,15],[17,16],[18,19],[20,21],[22,23]];const history={0:'Leshrac',1:'Pudge'};let turn=2;function renderHistory(){document.getElementById('history').innerHTML=DRAFT_PAIRS.map(pair=>{const p=[pair[1],pair[0]];return '<div style="grid-template-columns: 1fr 36px 1fr"><div>'+slot(p[0])+'</div><div>'+pair.filter(n=>n!==null).sort((a,b)=>a-b).map(n=>'<span class="'+(n===turn?'font-bold':'')+'">'+(n+1)+'</span>').join('')+'</div><div>'+slot(p[1])+'</div></div>'}).join('')}function slot(n){if(n===null)return '<div></div>';return '<div style="width:54px">'+(history[n]?'<img alt="'+history[n]+'" src="'+DC.heroes.find(h=>h.localized_name===history[n]).img+'">':n===turn?'BAN':'')+'</div>'}document.getElementById('own').onclick=()=>{history[8]='Muerta';turn=9;renderHistory()};document.getElementById('enemy').onclick=()=>{history[7]='Chaos Knight';renderHistory()};document.getElementById('ban').onclick=()=>{history[9]='Axe';turn=10;renderHistory()};document.getElementById("complete").onclick=()=>{document.getElementById("history").remove();const header=document.createElement("div");header.setAttribute("aria-label","Match drafts with prep countdown");for(const name of ["Muerta","Mirana","Mars","Hoodwink","Lion","Chaos Knight","Batrider","Centaur Warrunner","Vengeful Spirit","Rubick"]){const box=document.createElement("div"),image=document.createElement("img");box.title=name;image.src=DC.heroes.find(h=>h.localized_name===name).img;box.append(image);header.append(box)}document.body.append(header);['Muerta','Mirana','Mars','Hoodwink','Lion'].forEach((name,i)=>{const select=document.createElement('select');select.id='lineup-role-'+DC.heroes.find(h=>h.localized_name===name).id;select.setAttribute('aria-label','Native role for '+name);for(const role of ['carry','mid','offlane','support','hard_support'])select.add(new Option(role,role));select.selectedIndex=i;document.body.append(select)})};document.getElementById('scout').onclick=()=>{const brief=document.createElement('section');brief.id='scout-brief';brief.innerHTML='<h1>Scout briefing</h1><p>Faction radiant</p>'+DC.questions.map(q=>'<div><p>'+q.title+'</p><p>'+(DC.presets.lateScale[q.id]==='a'?q.optionA:q.optionB).name+'</p></div>').join('');document.body.append(brief);document.getElementById('history').hidden=true};document.getElementById('enter').onclick=()=>{document.getElementById('scout-brief')?.remove();document.getElementById('history').hidden=false};document.getElementById('layout').onclick=()=>{const first=document.querySelector('#history>div');first.style.gridTemplateColumns=first.style.gridTemplateColumns==='1fr 36px 1fr'?'1fr 40px 1fr':'1fr 36px 1fr'};renderHistory();
</script><script src="bundle-fixture.js?v=9"></script></body></html>
