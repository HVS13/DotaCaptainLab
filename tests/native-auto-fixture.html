<!doctype html><html lang="en"><head><meta charset="utf-8"><meta charset="utf-8"><title>Auto mode native-control replay</title><style>body{background:#101923;color:#e5edf4;font:15px system-ui;margin:24px;max-width:740px}button,select{padding:7px;margin:3px}#heroes{display:flex;flex-wrap:wrap;max-height:200px;overflow:auto}#heroes img{width:35px}#history img{width:28px}#history>div{display:grid;border-bottom:1px solid #344}#strategy img{width:45px}.font-bold{font-weight:bold}</style></head><body><h1>Native auto-control replay</h1><p>Local test: visible history, hero cards, confirm actions, roles, six sequential choices and Continue.</p><button id="scheduledBreak">Break detection after 2 seconds</button><button id="break">Break/restore detection</button><p id="turn"></p><input placeholder="Search heroes..." aria-label="Native game search"><div id="history"></div><div id="heroes"></div><button id="confirm" disabled></button><div id="strategy"></div><p id="result" role="status"></p><script src="../dist/engine.js"></script><script>
const pairs=[[0,null],[1,2],[4,3],[null,5],[null,6],[7,8],[9,null],[10,11],[13,12],[14,15],[17,16],[18,19],[20,21],[22,23]],seq=[['radiant','ban'],['radiant','ban'],['dire','ban'],['dire','ban'],['radiant','ban'],['dire','ban'],['dire','ban'],['radiant','pick'],['dire','pick'],['radiant','ban'],['radiant','ban'],['dire','ban'],['dire','pick'],['radiant','pick'],['radiant','pick'],['dire','pick'],['dire','pick'],['radiant','pick'],['radiant','ban'],['dire','ban'],['radiant','ban'],['dire','ban'],['radiant','pick'],['dire','pick']];let turn=0,selected=null,actions=[],strategy={},roles={},builds={};
const used=()=>new Set(actions.filter(Boolean).map(a=>a.id));
function paint(){if(turn===24){document.getElementById('turn').textContent='Draft complete 5 Opening strategy…';setTimeout(prep,1200);return}const step=seq[turn];const banner=step[0]==='radiant'?"YOUR TEAM'S TURN TO "+step[1].toUpperCase():"OPPONENT'S TURN TO "+step[1].toUpperCase();document.getElementById('turn').textContent=banner;if(new URLSearchParams(location.search).has('lag')&&step[0]==='radiant'&&turn>0){const bannerTurn=turn;document.getElementById('turn').textContent='DIRE IS CHOOSING...';setTimeout(()=>{if(turn===bannerTurn)document.getElementById('turn').textContent=banner},1600)}document.getElementById('history').innerHTML=pairs.map(pair=>'<div style="grid-template-columns: 1fr 36px 1fr"><div>'+slot(pair[0])+'</div><div>'+pair.filter(n=>n!==null).sort((a,b)=>a-b).map(n=>'<span class="'+(n===turn?'font-bold':'')+'">'+(n+1)+'</span>').join('')+'</div><div>'+slot(pair[1])+'</div></div>').join('');document.getElementById('heroes').innerHTML='';for(const hero of DC.heroes){const b=document.createElement('button');b.disabled=used().has(hero.id)||step[0]!=='radiant';b.innerHTML='<img alt="'+hero.localized_name+'" src="'+hero.img+'"><span>'+hero.localized_name+'</span>';b.onclick=()=>{selected=hero;document.getElementById('turn').textContent=hero.localized_name.toUpperCase()+' SELECTED';const confirm=document.getElementById('confirm');confirm.textContent=step[1].toUpperCase()+' '+hero.localized_name;confirm.disabled=false};document.getElementById('heroes').append(b)}document.getElementById('confirm').disabled=true;if(step[0]==='dire')setTimeout(()=>{actions[turn]=DC.heroes.find(h=>!used().has(h.id));turn++;paint()},500)}
function slot(n){return n===null?'<div></div>':'<div style="width:54px">'+(actions[n]?'<img alt="'+actions[n].localized_name+'" src="'+actions[n].img+'">':'')+'</div>'}
document.getElementById('confirm').onclick=()=>{if(!selected)return;actions[turn]=selected;selected=null;turn++;paint()};document.getElementById('scheduledBreak').onclick=()=>setTimeout(()=>{const first=document.querySelector('#history>div');if(first)first.style.gridTemplateColumns='1fr 40px 1fr'},2000);document.getElementById('break').onclick=()=>{const first=document.querySelector('#history>div');if(first)first.style.gridTemplateColumns=first.style.gridTemplateColumns==='1fr 36px 1fr'?'1fr 40px 1fr':'1fr 36px 1fr'};
function prep(){document.getElementById('history').remove();document.getElementById('heroes').remove();document.getElementById('confirm').remove();document.getElementById('turn').textContent='Strategy phase';const picks=team=>actions.filter((h,i)=>seq[i][0]===team&&seq[i][1]==='pick');const header=document.createElement('div');header.setAttribute('aria-label','Match drafts with prep countdown');const clock=document.createElement('p');clock.textContent=new URLSearchParams(location.search).get('short')?'0:15':'3:00';header.append(clock);for(const h of [...picks('radiant'),...picks('dire')]){const box=document.createElement('div');box.title=h.localized_name;box.innerHTML='<img src="'+h.img+'">';header.append(box)}document.getElementById('strategy').append(header);for(const h of picks('radiant')){const label=document.createElement('label');label.textContent=h.localized_name;const select=document.createElement('select');select.id='lineup-role-'+h.id;select.add(new Option('Choose role',''));for(const role of ['carry','mid','offlane','support','hard_support'])select.add(new Option(role,role));select.onchange=()=>roles[h.id]=select.value;const hidden=select.cloneNode(true);hidden.style.display='none';label.append(hidden,select);const editor=document.createElement('div');editor.dataset.items=h.id;label.append(editor);const paintItems=()=>{editor.innerHTML='';const items=builds[h.id]||DC.builds.z8(h.id,roles[h.id]||'carry');for(let slot=0;slot<6;slot++){const item=DC.items.find(item=>item.id===items[slot]),button=document.createElement('button');button.title=item?item.name:'Slot '+(slot+1)+' - tap to add an item';button.innerHTML=item?'<img alt="'+item.name+'" src="'+item.icon+'">':String(slot+1);button.onclick=()=>{const dialog=document.createElement('div');dialog.setAttribute('role','dialog');dialog.setAttribute('aria-label','Choose item for slot '+(slot+1));for(const choice of DC.items.filter(item=>!item.retired)){const pick=document.createElement('button');pick.innerHTML='<img alt="'+choice.name+'" src="'+choice.icon+'">'+choice.name;pick.onclick=()=>{const next=[...items];for(let i=0;i<6;i++)if(i!==slot&&next[i]===choice.id)next[i]='';next[slot]=choice.id;builds[h.id]=next.filter(Boolean);dialog.remove();paintItems()};dialog.append(pick)}document.body.append(dialog)};editor.append(button)}};paintItems();const focus=document.createElement('button');focus.setAttribute('aria-label',h.localized_name+', role not set');focus.textContent=h.localized_name;focus.onclick=()=>{for(const field of document.querySelectorAll('select[id^="lineup-role-"]'))field.style.display=field===select?'':'none'};select.style.display=Object.keys(roles).length===0&&h.id===picks('radiant')[0].id?'':'none';select.onchange=()=>{if(select.value&&Object.entries(roles).some(([id,role])=>Number(id)!==h.id&&role===select.value)){select.value=roles[h.id]||'';return}if(select.value)roles[h.id]=select.value;else delete roles[h.id];if(select.value)builds[h.id]=[...DC.builds.z8(h.id,select.value)];paintItems();const names={carry:'Carry',mid:'Mid',offlane:'Offlane',support:'Support',hard_support:'Hard support'};focus.setAttribute('aria-label',h.localized_name+', '+(names[select.value]||'role not set'))};document.getElementById('strategy').append(focus,label)}const macro=document.createElement('div');macro.innerHTML='<div><h2>Strategy calls</h2></div><span id=macroProgress></span>';document.getElementById('strategy').append(macro);const questions=document.createElement('div');questions.id='questions';document.getElementById('strategy').append(questions);paintQuestion();const next=document.createElement('button');next.textContent='Continue';next.onclick=()=>{if(Object.keys(builds).length!==5||Object.values(builds).some(build=>build.length!==6||new Set(build).size!==6))throw Error('Incomplete items');if(Object.keys(roles).length!==5||new Set(Object.values(roles)).size!==5||Object.keys(strategy).length!==6)throw Error('Incomplete config');document.getElementById('result').textContent='Completed: 24 draft turns; five unique roles; all six strategies applied; five ordered item builds verified; Continue clicked.';const applied=document.createElement('div');applied.id='appliedItems';applied.innerHTML=Object.entries(builds).map(([id,items])=>'<p>'+DC.heroes.find(hero=>hero.id===Number(id)).localized_name+': '+items.map(id=>DC.items.find(item=>item.id===id).name).join(' > ')+'</p>').join('');document.body.append(applied);document.getElementById('strategy').remove();document.getElementById('turn').textContent=new URLSearchParams(location.search).get('pvp')?'Waiting for opponent They are finishing strategy — the match starts when both players continue.':'LIVE MATCH'};document.getElementById('strategy').append(next)}
function paintQuestion(){const box=document.getElementById('questions');box.innerHTML='';const q=DC.questions.find(q=>!strategy[q.id]);document.getElementById('macroProgress').textContent=q?'Call '+(Object.keys(strategy).length+1)+'/6':'Done';if(!q)return;const title=document.createElement('h2');title.textContent=q.title;box.append(title);for(const value of ['a','b']){const b=document.createElement('button');b.innerHTML='<span>'+value.toUpperCase()+'</span><span>'+(value==='a'?q.optionA:q.optionB).name+'</span>';b.onclick=()=>{strategy[q.id]=value;paintQuestion()};box.append(b)}}document.querySelector('input').oninput=()=>setTimeout(()=>{const query=document.querySelector('input').value.toLowerCase();for(const b of document.querySelectorAll('#heroes>button'))b.style.display=b.textContent.toLowerCase().includes(query)?'':'none'},100);if(new URLSearchParams(location.search).get('prep')){const own=['Muerta','Mirana','Mars','Hoodwink','Lion'].map(name=>DC.heroes.find(h=>h.localized_name===name)),enemy=['Chaos Knight','Batrider','Centaur Warrunner','Vengeful Spirit','Rubick'].map(name=>DC.heroes.find(h=>h.localized_name===name));actions=seq.map(step=>step[1]==='pick'?(step[0]==='radiant'?own.shift():enemy.shift()):null);turn=24}paint();
</script><script src="bundle-fixture.js?v=auto11"></script></body></html>
